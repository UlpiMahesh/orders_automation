name: Build Windows installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Bundle Chromium inside the app (works offline, no browser setup for teammates)
        run: python -m playwright install chromium
        env: { PLAYWRIGHT_BROWSERS_PATH: "0" }
      - run: pyinstaller packaging/orders_desk.spec --noconfirm --clean
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path src\orders_desk\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
          Compress-Archive -Path dist-installer\*.exe -DestinationPath "dist-installer\OrdersDesk-Setup-$v.zip"
          Compress-Archive -Path dist\OrdersDesk -DestinationPath "dist-installer\OrdersDesk-Portable-$v.zip"
      - uses: actions/upload-artifact@v4
        with: { name: OrdersDesk-installer, path: dist-installer/*.zip }
