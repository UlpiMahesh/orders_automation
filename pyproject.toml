[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-desk"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.7,<7", "openpyxl>=3.1.2,<4.0", "playwright>=1.45,<2.0"]
[project.scripts]
orders-desk = "orders_desk.__main__:main"
[tool.setuptools.dynamic]
version = {attr = "orders_desk.__version__"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
orders_desk = ["qml/*", "resources/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
